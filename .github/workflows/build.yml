name: Build EVE-O-Preview (CN)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]   # 当发布正式版本时触发

jobs:
  build:
    runs-on: windows-latest   # 必须用 Windows，因为依赖 .NET Framework 和 WinForms

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 MSBuild（确保路径正确）
        uses: microsoft/setup-msbuild@v1.1

      - name: 安装 NuGet
        uses: NuGet/setup-nuget@v1

      - name: 还原 NuGet 包
        run: nuget restore EVE-O-Preview.sln

      - name: 构建 Release 版本（Any CPU）
        run: |
          msbuild EVE-O-Preview.sln /p:Configuration=Release /p:Platform="Any CPU" /verbosity:minimal

      - name: 上传构建产物（供后续测试或下载）
        uses: actions/upload-artifact@v3
        with:
          name: EVE-O-Preview-Release
          path: EVE-O-Preview\bin\Release\

      # （可选）如果是 release 事件，还可以自动打包并上传到 Release 附件
      - name: 打包为 ZIP（用于 Release）
        if: github.event_name == 'release'
        run: |
          Compress-Archive -Path EVE-O-Preview\bin\Release\* -DestinationPath EVE-O-Preview.zip
      - name: 上传到 Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./EVE-O-Preview.zip
          asset_name: EVE-O-Preview.zip
          asset_content_type: application/zip
